train_conf: # 데이터 학습
  model: yolo26n.pt # 모델 (Ultralytics pretrained)
  epochs: 1000 # 학습을 진행할 epoch 수 입니다.
  batch_size: 512 # 학습을 진행할 batch size 입니다.
  image_size: 320 # 학습을 진행할 이미지 사이즈 입니다. 사이즈 예시 : 224, 320, 640
  device: 0  # 학습을 진행할 때 쓸 device 입니다.  cpu or '0, 1, 2, 3'
  dataset_yaml: yaml/radar_dataset.yaml # 데이터셋의 정보가 담긴 config 파일입니다. 현 파일의 경로를 입력하시면 됩니다.
  patience: 100 # early stopping patience (epoch)

# 추론 경로는 모두 저장소 루트 기준입니다 (절대 경로도 허용). Paths are relative to the repository root.
inference:
  source: sample_images/radar2.png # 이미지 파일 또는 폴더 (공개 샘플 1장) / image file or folder
  weight: runs/detect/train4/weights/best.pt # 커밋된 학습 가중치. 없으면 다운로드/재학습하지 않고 에러 / committed checkpoint, never downloaded
  circle_json: src/test_inference/test_circle_coordinates_old.json # 원형 스캔 영역 (flat 또는 old_radar 중첩 JSON) / scan circle in pixels
  save: true # 주석 PNG + JSON 저장 / save annotated PNG + JSON sidecar
  save_dir: outputs/inference # 결과 폴더 (git-ignored) / output folder
  show: false # true 일 때만 창 표시 (GUI 필요) / opt-in preview window
  conf: 0.25 # confidence threshold
  grayscale: false # true: 이전 파이프라인처럼 gray->BGR 입력 / legacy gray->BGR model input

# -------------------- 하이퍼 파라미터 (YOLO26) ----------------------
hyp:
  lr0: 0.01  # initial learning rate
  lrf: 0.01  # final OneCycleLR learning rate (lr0 * lrf)
  momentum: 0.937  # SGD momentum
  weight_decay: 0.0005  # optimizer weight decay
  warmup_epochs: 3.0  # warmup epochs
  warmup_momentum: 0.8  # warmup initial momentum
  warmup_bias_lr: 0.1  # warmup initial bias lr
  box: 7.5  # box loss gain
  cls: 0.5  # cls loss gain
  dfl: 1.5  # dfl loss gain
  hsv_h: 0.015  # image HSV-Hue augmentation (fraction)
  hsv_s: 0.7  # image HSV-Saturation augmentation (fraction)
  hsv_v: 0.4  # image HSV-Value augmentation (fraction)
  degrees: 0.0  # image rotation (+/- deg)
  translate: 0.1  # image translation (+/- fraction)
  scale: 0.5  # image scale (+/- gain)
  shear: 0.0  # image shear (+/- deg)
  perspective: 0.0  # image perspective (+/- fraction), range 0-0.001
  flipud: 0.0  # image flip up-down (probability)
  fliplr: 0.5  # image flip left-right (probability)
  mosaic: 1.0  # image mosaic (probability)
  mixup: 0.0  # image mixup (probability)
  copy_paste: 0.0  # segment copy-paste (probability)
